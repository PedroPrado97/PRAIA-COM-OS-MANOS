  /* Véu suave para o branco das nuvens ficar legível */
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(10, 30, 50, .28) 0%, rgba(10, 30, 50, .10) 40%, rgba(10, 30, 50, .45) 100%);
  }

  main {
    width: min(100%, 720px);
    text-align: center;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-family: var(--font-title);
    font-weight: 800;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    margin-bottom: 2.5rem;
    text-shadow: 0 2px 12px rgba(10, 30, 50, .35);
  }
  .logo svg { width: 2.1rem; height: 2.1rem; }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(.4rem, 2vw, 1.25rem);
    justify-items: center;
    margin-bottom: 2.25rem;
  }

  .unit { width: 100%; max-width: 160px; }

  /* Cada número é uma nuvem: texto branco com bordas fofas e flutuando devagar */
  .cloud {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    animation: drift 6s ease-in-out infinite;
    filter: drop-shadow(0 10px 16px rgba(10, 30, 50, .30));
  }
  .unit:nth-child(2) .cloud { animation-delay: -1.5s; }
  .unit:nth-child(3) .cloud { animation-delay: -3s; }
  .unit:nth-child(4) .cloud { animation-delay: -4.5s; }

  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-6px) scale(1.02); }
  }

  .cloud text {
    font-family: var(--font-title);
    font-weight: 800;
    font-size: 150px;
    fill: var(--white);
    text-anchor: middle;
    font-variant-numeric: tabular-nums;
    filter: url(#nuvem);
  }

  .label {
    display: block;
    margin-top: .25rem;
    font-size: .95rem;
    font-weight: 500;
    text-shadow: 0 1px 8px rgba(10, 30, 50, .45);
  }

  form {
    display: flex;
    gap: .6rem;
    max-width: 520px;
    margin: 0 auto;
  }
  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: .95rem 1rem;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-size: 1rem;
    color: var(--navy);
    background: var(--white);
  }
  input[type="email"]::placeholder { color: #7a8899; }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    font-weight: 700;
    padding: .95rem 1.4rem;
    border: 0;
    border-radius: 10px;
    background: var(--cta);
    color: var(--white);
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-size: .95rem;
    transition: background-color .2s ease;
  }
  button:hover { background: var(--cta-hover); }

  .thanks {
    font-weight: 500;
    font-size: 1.05rem;
    min-height: 1.5em;
    margin-top: 1rem;
    text-shadow: 0 1px 8px rgba(10, 30, 50, .45);
  }

  @media (max-width: 480px) {
    form { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {

  .pops { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  main { position: relative; z-index: 1; }
  .pop {
    position: absolute;
    width: calc(var(--size) * var(--scale, 1));
    aspect-ratio: 1 / 1;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0;
    transform: rotate(var(--rot)) scale(0);
    filter: drop-shadow(0 6px 10px rgba(10, 30, 50, .28));
  }
  .pop.show {
    animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: rotate(var(--rot)) scale(0); }
    60%  { opacity: 1; transform: rotate(var(--rot)) scale(1.12); }
    100% { opacity: 1; transform: rotate(var(--rot)) scale(1); }
  }
  @media (max-width: 600px) { .pop { --scale: .7; } }
  @media (prefers-reduced-motion: reduce) { .pop.show { animation-duration: .01s; } }

<script>
  // Altere aqui a data do fim de semana (formato AAAA-MM-DDTHH:MM:SS, horário local).
  const CONFIG = { data: "2026-11-20T00:00:00" };
  const alvo = new Date(CONFIG.data);
  const pad = (n) => String(n).padStart(2, "0");

  const ids = {
    dias: document.getElementById("dias"),
    horas: document.getElementById("horas"),
    minutos: document.getElementById("minutos"),
    segundos: document.getElementById("segundos")
  };

  function atualizar() {
    const diff = alvo - new Date();

    if (diff <= 0) {
      ids.dias.textContent = "00";
      ids.horas.textContent = "00";
      ids.minutos.textContent = "00";
      ids.segundos.textContent = "00";
      clearInterval(timer);
      return;
    }

    const total = Math.floor(diff / 1000);
    ids.dias.textContent = pad(Math.floor(total / 86400));
    ids.horas.textContent = pad(Math.floor((total % 86400) / 3600));
    ids.minutos.textContent = pad(Math.floor((total % 3600) / 60));
    ids.segundos.textContent = pad(total % 60);
  }

  const timer = setInterval(atualizar, 1000);
  atualizar();

</script>
<script>
  // Os ícones aparecem em sequência assim que a página abre: cada um surge depois do anterior.
  const pops = Array.from(document.querySelectorAll(".pop"));
  const DURACAO = 420;
  let i = 0;
  function proximo() {
    if (i >= pops.length) return;
    pops[i++].classList.add("show");
    setTimeout(proximo, DURACAO);
  }
  proximo();
</script>
